name: Sync dev with main

on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-dev:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fast-forward dev to validated main commit
        env:
          MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Quality run did not provide a valid 40-character commit SHA."
            exit 1
          fi

          git cat-file -e "${MAIN_SHA}^{commit}"
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          DEV_SHA="$(git rev-parse refs/remotes/origin/dev)"

          if [[ "$DEV_SHA" == "$MAIN_SHA" ]]; then
            echo "dev is already synchronized with main at $MAIN_SHA."
            exit 0
          fi

          if git merge-base --is-ancestor "$DEV_SHA" "$MAIN_SHA"; then
            echo "Advancing dev from $DEV_SHA to validated main commit $MAIN_SHA."
            git push origin "$MAIN_SHA:refs/heads/dev"
            exit 0
          fi

          echo "::error::dev contains commits not present in main. Manual review is required before syncing."
          exit 1
